# InsureSphere AI — Render Blueprint (STAGING, prepared only — not deployed)
# Creating resources from this file may incur charges on non-free plans.
# Secrets marked sync: false must be filled in the Render dashboard and are
# never stored in git.
databases:
  - name: insuresphere-staging-db
    plan: basic
    postgresMajorVersion: "16"
    databaseName: insuresphere_staging
    user: insuresphere

services:
  - type: web
    name: insuresphere-api-staging
    runtime: python
    rootDir: django_backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn insuresphere_core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # set to this service's hostname, e.g. insuresphere-api-staging.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the Vercel frontend origin, e.g. https://insuresphere-staging.vercel.app
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: insuresphere-staging-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: insuresphere-staging-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: insuresphere-staging-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: insuresphere-staging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: insuresphere-staging-db
          property: port
      - key: GEMINI_API_KEY
        sync: false # server-side only, from the secret store — never in git
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "30"
      # Optional persistent uploads on S3-compatible storage (leave unset to
      # use the service disk — note Render disks are paid + persistent only
      # when a disk is attached):
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_SECRET_KEY
        sync: false
